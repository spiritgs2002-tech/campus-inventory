# 学校总务库存系统 · 反向代理 / 静态 / 限流
# 生产请将 listen 80 改为 443 并配置 ssl_certificate / ssl_certificate_key，
# 同时开启 HSTS（应用层 SECURE_HSTS_SECONDS 已设）。

upstream campus_inventory_app {
    server web:8000;
}

# 登录类接口限流区（防爆破）；生产按需调整速率
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;   # 10MiB 上传上限 + 协议开销

    # 静态资源由 nginx 直接服务（与 web 容器共享 staticfiles 卷）
    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 存活/就绪探针不代理到应用亦可，这里直接返回
    location = /health/live/ {
        proxy_pass http://campus_inventory_app;
        proxy_set_header Host $host;
    }
    location = /health/ready/ {
        proxy_pass http://campus_inventory_app;
        proxy_set_header Host $host;
    }

    # 认证接口限流
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://campus_inventory_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://campus_inventory_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket/HTMX 长轮询如需可加：
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
