# 学校总务库存系统 · 上线测试编排
# 用途：在隔离环境一键拉起 web + worker + beat + PostgreSQL16 + Redis + nginx
# 使用：
#   cp env.production.template .env   # 然后填入真实密钥与连接信息
#   docker compose -f docker-compose.yml --env-file .env up --build
#
# 说明：
#   - web/worker/beat 共用同一镜像与同一套环境变量、队列、私有 Redis
#   - 仅启动一个 beat 实例（清理/对账调度幂等，但避免重复投递）
#   - nginx 负责 TLS 终止、静态资源、登录限流；生产请将 80 改为 443 + 证书

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_inventory}
      # 固定为迁移 owner（compose 内 PG 初始超级用户）；切勿随 .env 的 DB_USER 变化，
      # 否则运行时服务会误以迁移身份连库，触发 require_runtime 拦截（/health/ready/ 503）。
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d ${DB_NAME:-campus_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # 运行身份固定为 inv_run（inventory_runtime 成员）；覆盖 .env 的 DB_USER，
      # 避免以迁移身份 inventory_app 连库被 require_runtime 拦截。
      DB_USER: inv_run
      DB_PASSWORD: ${RUN_DB_PASSWORD:?RUN_DB_PASSWORD required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py collectstatic --noinput &&
             uv run gunicorn campus_inventory.wsgi:application
             --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    networks: [appnet]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # 运行身份固定为 inv_run（inventory_runtime 成员）；覆盖 .env 的 DB_USER，
      # 避免以迁移身份 inventory_app 连库被 require_runtime 拦截。
      DB_USER: inv_run
      DB_PASSWORD: ${RUN_DB_PASSWORD:?RUN_DB_PASSWORD required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run celery -A campus_inventory worker --loglevel=INFO --concurrency=2
    networks: [appnet]

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # 运行身份固定为 inv_run（inventory_runtime 成员）；覆盖 .env 的 DB_USER，
      # 避免以迁移身份 inventory_app 连库被 require_runtime 拦截。
      DB_USER: inv_run
      DB_PASSWORD: ${RUN_DB_PASSWORD:?RUN_DB_PASSWORD required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 仅一个 beat 实例；--schedule 路径需为可写持久卷
    command: >
      uv run celery -A campus_inventory beat --loglevel=INFO
      --schedule /app/beat.db
    volumes:
      - beatdata:/app
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
    networks: [appnet]

volumes:
  pgdata:
  redisdata:
  staticfiles:
  beatdata:

networks:
  appnet:
    driver: bridge
