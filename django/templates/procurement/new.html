{% extends "pickup/base.html" %}{% block content %}<h1>请购申请</h1>{% if result %}<p>申请已提交：{{ result.document.order_no }}</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="idempotency_key" value="{{ key }}"><input type="hidden" name="token" value="{{ token }}"><label>物品编号<input name="item_id" value="{{ item }}" required list="items"></label><datalist id="items">{% for i in items %}<option value="{{ i.pk }}">{{ i.name }}</option>{% endfor %}</datalist><label>数量<input name="qty" type="number" min="0.001" step="0.001" required></label><label>原因<textarea name="reason" maxlength="2000" required></textarea></label>{% if not principal %}<label>姓名<input name="name" maxlength="120" required></label><label>工号<input name="employee_no" maxlength="80" required></label><p>免密申请须从物品二维码进入，姓名工号未经核验。请用同一工号登录以统一查收通知。</p>{% endif %}<button>提交申请</button></form>{% endblock %}
