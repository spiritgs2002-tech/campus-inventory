{% extends "base.html" %}{% block content %}<h1>通知</h1>{% for row in page %}<article><h2>{{ row.title }}</h2><p>{{ row.body }}</p><a href="/s/requisitions/">查看申请</a>{% if not row.is_read %}<form method="post" action="/api/v1/notifications/{{ row.pk }}/read/">{% csrf_token %}<button>标记已读</button></form>{% endif %}</article>{% empty %}<p>暂无通知</p>{% endfor %}{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">上一页</a>{% endif %}{% if page.has_next %}<a href="?page={{ page.next_page_number }}">下一页</a>{% endif %}{% endblock %}
