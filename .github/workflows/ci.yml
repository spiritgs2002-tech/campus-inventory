name: ci
# Canonical inventory workflow. Portable copy: <app>/docs/ci/ci.yml.template.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          # Unique, disposable CI-only credential; no deployment secret is stored.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
      # DBA connection for disposable verify scripts; never apply schema here.
      DB_NAME: postgres
      # 测试库名：被测试运行身份(inventory_ci)复用，避免需要 CREATEDB（会触发 require_runtime 拒绝）。
      TEST_DB_NAME: test_campus_inventory
    steps:
      - uses: actions/checkout@v4
      - name: Locate application
        run: |
          if test -f manage.py; then
            echo 'APP_DIR=.' >> "$GITHUB_ENV"
          elif test -f inventory-v4/django/manage.py; then
            echo 'APP_DIR=inventory-v4/django' >> "$GITHUB_ENV"
          elif test -f django/manage.py; then
            echo 'APP_DIR=django' >> "$GITHUB_ENV"
          else
            echo 'Cannot locate inventory manage.py' >&2
            exit 1
          fi
      - name: Verify canonical CI delivery
        run: python "$APP_DIR/scripts/verify_ci_delivery.py" --repo-root "$GITHUB_WORKSPACE"
      - name: Verify authoritative SQL fingerprint and current snapshot
        run: python "$APP_DIR/scripts/sync_schema_snapshot.py" --check
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.13"
      - name: Generate ephemeral application signing key
        run: |
          python - <<'PY'
          import os
          import secrets
          key = secrets.token_urlsafe(64)
          print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SECRET_KEY=" + key + "\n")
          PY
      - run: uv sync --frozen
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python manage.py precheck_sql
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python manage.py check
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python manage.py verify_config_examples
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python scripts/verify_p1.py
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python scripts/verify_p2_p3.py
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python scripts/verify_p4.py
        working-directory: ${{ env.APP_DIR }}
      - run: uv run python scripts/verify_p5.py
        working-directory: ${{ env.APP_DIR }}
      - name: Install disposable-test Redis binary
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server
      - run: uv run python scripts/verify_p6.py
        working-directory: ${{ env.APP_DIR }}
      - name: Create dedicated Django suite baseline database
        working-directory: ${{ env.APP_DIR }}
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(
              host=os.environ["DB_HOST"], port=os.environ["DB_PORT"],
              user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"],
              dbname=os.environ["DB_NAME"], autocommit=True,
          ) as admin:
              admin.execute("CREATE DATABASE campus_inventory")
          PY
      - name: Apply suite baseline
        run: uv run python manage.py apply_schema
        working-directory: ${{ env.APP_DIR }}
        env:
          DB_NAME: campus_inventory
      # ---------------------------------------------------------------------------
      # CI 测试身份调整：
      #   现有代码强制 require_runtime()——业务命令/服务必须以“普通运行身份”
      #   (inventory_runtime 成员) 执行，拒绝超户/有 CREATEDB 的角色。
      #   原 CI 用 postgres 超户跑 manage.py test，会导致所有运行身份守卫
      #   （import_repairs、notify、procurement、reconcile、pickup、auth…）直接失败。
      #   修复：建 inventory_ci（inventory_runtime 成员、无 CREATEDB），
      #        预建测试库并以运行身份复用(--keepdb)，配套 grant-ci-test.sql 补回
      #        测试 fixture 需要的 django_migrations 读权与 tenants 写权。
      # ---------------------------------------------------------------------------
      - name: Create CI runtime identity + dedicated test database
        working-directory: ${{ env.APP_DIR }}
        env:
          DB_NAME: postgres
        run: |
          uv run python - <<'PY'
          import os, psycopg, pathlib
          host, port, pw = os.environ["DB_HOST"], os.environ["DB_PORT"], os.environ["DB_PASSWORD"]
          dsn = f"host={host} port={port} user={os.environ['DB_USER']} password={pw} dbname=postgres"
          with psycopg.connect(dsn, autocommit=True) as admin:
              admin.execute(
                  "DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='inventory_runtime') "
                  "THEN CREATE ROLE inventory_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE "
                  "NOREPLICATION NOBYPASSRLS; END IF; END $$;"
              )
              admin.execute(
                  "DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='inventory_ci') "
                  "THEN CREATE ROLE inventory_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE "
                  "NOREPLICATION NOBYPASSRLS PASSWORD 'ci-only'; END IF; END $$;"
              )
              admin.execute("GRANT inventory_runtime TO inventory_ci")
              if not admin.execute(
                  "SELECT 1 FROM pg_database WHERE datname='test_campus_inventory'"
              ).fetchone():
                  admin.execute("CREATE DATABASE test_campus_inventory TEMPLATE campus_inventory")
          test_dsn = f"host={host} port={port} user={os.environ['DB_USER']} password={pw} dbname=test_campus_inventory"
          for fn in ("sql/grant-runtime.sql", "sql/grant-ci-test.sql"):
              sql = pathlib.Path(fn).read_text()
              with psycopg.connect(test_dsn, autocommit=True) as c:
                  c.execute(sql)
          print("CI runtime identity + test database ready")
          PY
      - name: Run runtime-guarded verification scripts as CI runtime identity
        working-directory: ${{ env.APP_DIR }}
        env:
          DB_NAME: test_campus_inventory
          DB_USER: inventory_ci
          DB_PASSWORD: ci-only
        run: |
          uv run python scripts/verify_p7.py
          uv run python scripts/verify_p8a.py
          uv run python scripts/verify_p8b.py
          uv run python scripts/verify_p8c.py
          uv run python scripts/verify_readiness.py
      - name: Run full Django regression suite as CI runtime identity
        working-directory: ${{ env.APP_DIR }}
        env:
          DB_NAME: test_campus_inventory
          DB_USER: inventory_ci
          DB_PASSWORD: ci-only
          TEST_DB_NAME: test_campus_inventory
        run: uv run python manage.py test tests --no-input --keepdb
      - name: Verify suite schema and runtime ACL
        working-directory: ${{ env.APP_DIR }}
        env:
          DB_NAME: campus_inventory
        run: |
          uv run python manage.py verify_schema
          uv run python manage.py verify_runtime
      - name: Verify requirements match the frozen lock
        run: |
          uv export --frozen --format requirements-txt --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
        working-directory: ${{ env.APP_DIR }}
